[project]
name = "mie-hodlod"
version = "1.0.0"
description = "Self-learning HOD-fade / LOD-reclaim intraday ML engine (FMP data, triple-barrier meta-labeling, purged walk-forward)"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.9",
    "numpy>=1.26",
    "duckdb>=1.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "typer>=0.12",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    "pyarrow>=17.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# CPU wheel: pip install "torch>=2.6,<2.8" --index-url https://download.pytorch.org/whl/cpu
dl = ["torch>=2.6,<2.8"]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
mie = "engine.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
