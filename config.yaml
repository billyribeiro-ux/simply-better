# MIE HOD/LOD Engine — master configuration
universe: [AAPL, NVDA, AMZN, NFLX, SPY, QQQ, IWM, TSLA]

data:
  cache_dir: data/parquet
  db_path: data/engine.duckdb
  detect_tf: 5min
  refine_tf: 1min

session:
  open: "09:30"
  close: "16:00"
  flat_by: "15:55"        # all positions closed here — pure day trading
  # no fresh entries after this. 14:50 (was 15:00): the final two trigger
  # bars leave no time to traverse runway — window hygiene adopted at ZERO
  # expectancy credit (2026-07 research program; replicated in 3 runs).
  # NOTE: gates on the trigger bar's OPEN timestamp (setups.detect).
  no_new_after: "14:50"
  min_trigger: "10:00"    # HOD/LOD setups need an established range first

setups:
  cooldown_bars: 6        # 5-min bars between same-side triggers
  max_per_side_per_day: 2
  # net-of-cost EV gate (pre-registered 2026-07-08, ledger): take a trade only
  # when p*(target/stop) - (1-p) - cost_R > 0, i.e. its expected value clears
  # that name's MEASURED execution cost. Follows directly from the root-cause
  # audit (thin edge on the transaction-cost boundary). Applied identically in
  # learn.run_research and live.scan_live via engine/costs.py.
  net_ev_gate: true
  day_type:
    # decision-layer trend veto: skip triggers whose aligned first-hour
    # directional efficiency exceeds this (fighting a trending session).
    # FROZEN at 0.45 (2026-07 research program) — retuning on the mined
    # range restarts the multiplicity clock. For continuation setups the
    # same rule automatically vetoes counter-trend breaks.
    eff_gate_max: 0.45
  hod_fade:
    enabled: false        # concept refuted 3x incl. 2024 holdout (ledger)
    ext_min_atr: 0.35     # HOD must extend >= this * daily ATR above open
    wick_frac_min: 0.35   # upper wick as fraction of bar range (rejection)
  lod_reclaim:
    enabled: false        # concept refuted 3x incl. 2024 holdout (ledger)
    ext_min_atr: 0.35
    wick_frac_min: 0.35
  # concept 2 — trend continuation. Re-enabled 2026-07-08 by owner order for
  # the end-to-end root-cause audit (do NOT disable). Honest standing: the
  # +0.086R edge does not survive costs (run 40ff77b9cc42, net −$6,578) — the
  # audit is determining WHY, with evidence, before any adopt/reject call.
  hod_break:
    enabled: true
    ext_min_atr: 0.35     # extension above open, mirrored from the fade spec
    body_frac_min: 0.5    # close in the break-side half of the trigger bar
    eff_min: 0.30         # session efficiency already aligned with the break
  lod_break:
    enabled: true
    ext_min_atr: 0.35
    body_frac_min: 0.5
    eff_min: 0.30
  # concept 3 — opening range breakout. REMOVED 2026-07-08 by owner call: ORB
  # is a crowded retail pattern, not an institutional edge, and the evidence
  # agreed — ORB_UP -$32,148, ORB_DOWN -$254 (run 58a9b85dbf1d), the worst
  # performers in the book. Disabled for good; not a research-bench item.
  orb_up:
    enabled: false
    or_minutes: 30        # opening range = bars closing <= 10:00
  orb_down:
    enabled: false
    or_minutes: 30

entry:
  confirm_bars_1m: 15     # 1-min bars allowed for break confirmation
  tick: 0.01

geometry:
  # net-of-cost objective (cycle-2 experiment, ledger 2026-07-08). When true,
  # the search subtracts modeled round-trip cost in R, 2*(slip*px+comm)/
  # (stop*atr), from each candidate's expectancy — pushes toward wider,
  # cheaper stops. Left OFF: it did not rescue concept-2 to profitability
  # (the edge's CI straddles zero once stops widen). Kept as a validated tool.
  net_of_cost: false
  # candidate stop/target levels are taken from these quantiles of the
  # observed MAE / MFE distributions (in ATR units), snapped to the scan grid
  stop_quantiles: [0.55, 0.65, 0.75, 0.85]
  target_quantiles: [0.45, 0.55, 0.65, 0.75]   # retained: the "atr" anchor mode
  anchor_fracs: [0.5, 0.618, 0.786, 1.0]        # fraction of anchor distance
  anchors: [vwap, day_open, prior_close, pd_poc, dev_poc]
  min_room_atr: 0.3      # anchor candidates need at least this much runway
  vol_regimes: 3          # low / mid / high Garman-Klass vol terciles
  min_samples: 60         # per (setup, regime) cell before it trusts itself
  scan_grid: {start: 0.1, stop: 3.0, step: 0.1}   # ATR multiples

model:
  calibrate: true         # isotonic calibration on out-of-fold train probs
  oof_folds: 4            # expanding chronological blocks for OOF probabilities
  ensemble_seeds: 3       # seed-bagged LightGBM members, probabilities averaged
  # research trials charged into DSR deflation on top of the geometry x
  # threshold search — full breakdown in docs/research-ledger.md
  # (148 program + 20 cycle2 + 6 concept-2 + 4 concept-3 + 2 cost-structure
  #  + 2 net-EV + 15 MIE-DL design DOF)
  external_trials: 197
  params:
    num_leaves: 31
    learning_rate: 0.05
    n_estimators: 400
    min_child_samples: 40
    subsample: 0.9
    colsample_bytree: 0.9
    reg_lambda: 1.0
  walk_forward:
    min_train_months: 6
    embargo_days: 5
  threshold:
    default: 0.55
    grid: {start: 0.45, stop: 0.70, step: 0.025}
    min_trades: 30        # validation trades required to trust an optimized threshold

learning:
  tree_depth: 3
  min_leaf_support: 25
  loss_rate_trigger: 0.55 # leaves losing more than this spawn an adjustment rule
  threshold_bump: 0.07    # extra probability demanded in flagged regimes

execution:
  slippage_bps: 2.0       # flat fallback for any symbol not measured below
  # per-symbol MEASURED effective half-spread (Corwin-Schultz 2012 on the
  # 5-min bars, 2024-2026) — a conservative UPPER bound on true slippage, and
  # a measurement, NOT a P&L tune (lowering these to manufacture profit is
  # banned; ledger 2026-07-08 root-cause finding). Replaces the arbitrary flat
  # 2.0 bps that sat just past the strategy's 1.69 bps/side break-even.
  slippage_bps_by_symbol:
    SPY: 0.7
    QQQ: 0.9
    IWM: 0.9
    AAPL: 1.3
    AMZN: 1.5
    NFLX: 1.4
    NVDA: 2.3
    TSLA: 2.9
  commission_per_share: 0.0035
  # owner order 2026-07-09: flat ONE share per trade, no sizing model.
  # R-based metrics and the net-EV gate are share-independent, so the
  # statistical record is unchanged; only dollar magnitudes scale.
  fixed_shares: 1
  risk_per_trade_pct: 0.5 # retained for reference; unused when fixed_shares set
  max_concurrent: 4
  max_daily_loss_pct: 1.5 # kill switch: no new entries after losing this % in a day
  starting_equity: 100000

export:
  out_dir: dashboard/static/data

live:
  model_path: data/model/production.pkl
  out_file: dashboard/static/data/live.json
  paper_file: dashboard/static/data/paper.json
  lookback_sessions: 5    # 5-min history fed to the detector (anchors/context)
  poll_seconds: 60

# MIE-DL — deep sequence model, tops & bottoms (pre-registered 2026-07-09,
# ledger). All constants below are FIXED A PRIORI; changing any of them on
# this range restarts the multiplicity clock. enabled flips true only if the
# pre-registered gates A+B+C pass.
dl:
  enabled: false
  seed: 7
  model_path: data/model/dl_production.pt
  cache_dir: data/dl            # per-symbol causal feature caches
  horizon_min: 15               # primary label horizon (secondary 30, run once)
  seq_1m: 64                    # 1-min branch length
  seq_5m: 48                    # 5-min branch length
  ewma_halflife_1m: 120         # causal vol normalization (within-session)
  ewma_halflife_5m: 24
  decision:                     # 5-min grid decision bars
    first: "10:35"              # guarantees 64 within-session 1-min bars
    last: "15:30"               # label horizon fits before flat_by
  train:
    batch: 512
    max_epochs: 15
    patience: 3
    lr: 0.002
    weight_decay: 0.0001
    val_frac: 0.15              # session-tail validation slice
    embargo_days: 5             # purged between train core and val
    max_train_samples: 250000   # keep most recent if exceeded (budget rule)
  trade:
    k_stop: 1.0                 # stop  = 1.0 vol-unit (sigma_t * sqrt(H))
    k_target: 1.0               # target = 1.0 vol-unit
    time_exit_min: 30
    s_min_default: 0.20
    s_min_grid: {start: 0.05, stop: 0.55, step: 0.05}
    s_min_min_trades: 100
    max_concurrent: 4
    cooldown_min: 30
  eval:
    folds: 7                    # expanding quarterly refits, ledger schedule
    min_train_months: 9
    test_months: 3
